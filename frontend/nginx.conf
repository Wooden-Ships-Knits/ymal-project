server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api → the FastAPI container. The browser only ever talks to this
    # origin, so there is no CORS to configure and no Shopify credential in
    # the bundle: the console asks our API, our API asks Shopify.
    location /api/ {
        # Docker's embedded DNS. Resolving through a VARIABLE defers the lookup
        # to request time - with a literal hostname, nginx resolves at startup
        # and refuses to boot with "host not found in upstream" whenever the
        # api container is not running. The console is meant to load and say
        # "not connected", not fail to start.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://api:8000;
        proxy_pass $upstream;
        # The block build pulls thousands of orders. A rebuild triggered from
        # the console can legitimately take minutes.
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single page app: every other path renders index.html and the app decides.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
