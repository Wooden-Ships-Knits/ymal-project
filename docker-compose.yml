# YMAL — one compose for the whole project.
#
# Modelled on wholesale-order-entry, which already runs this shape on the VM:
# Postgres, a FastAPI backend, and an nginx container that serves the built SPA
# and reverse-proxies /api to the backend.
#
# IMPORTANT: run this from a LOCAL clone, not from the Google Drive folder this
# repo currently lives in. Drive's sync and file locking make bind mounts
# unreliable. On the VM: git clone, then docker compose up.
#
#   docker compose up web                  # the console (build + serve)
#   docker compose up -d --build           # console + api together
#   docker compose run --rm api python -m scripts.nightly
#
# One-shot pipeline work runs in the `api` service, NOT in a service of its
# own. There used to be a profile-gated `pipeline` service, and it caused a
# real bug: `docker compose up -d --build` does not rebuild services outside
# the default profile, so the pipeline image silently stayed on the code it
# was first built with. On 2026-09-11 the nightly cron was still publishing a
# 90-day Top Selling list from that stale image while the console's Manual
# Update - which runs inside `api` - correctly produced 14 days. Two copies of
# settings.py, one storefront, and nothing failing loudly.
#
# `api` is a superset of what the pipeline needed (same image, same .env, same
# data volume, plus the database), it is always rebuilt by `up --build`, and it
# matches how the sibling stack on this VM already runs its nightly syncs.
#
# The console's host port defaults to 8083 and is overridable with
# YMAL_WEB_PORT in .env, since one VM may run several of these stacks.
#
# Secrets come from .env at the repo root and are never baked into an image.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ymal}
      POSTGRES_USER: ${POSTGRES_USER:-ymal}
      # No default on purpose: `:?` fails loudly if it is unset, rather than
      # shipping a password that is public in this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ymal} -d ${POSTGRES_DB:-ymal}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # The console's API. No longer profile-gated: backend/app exists, so this
  # starts with `docker compose up` alongside the console.
  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      # Passed as separate parts, NOT as a URL. A password is not URL-safe -
      # this shop's contains a "/", which terminates a URL's authority section
      # and makes the host parse as the database name. psycopg quotes each
      # value properly when given them separately.
      #
      # The previous value also used SQLAlchemy's "postgresql+psycopg://"
      # dialect form, which psycopg itself does not accept.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-ymal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ymal}
    volumes:
      - ymal_data:/app/data
      # Release notes, rendered on the console's Dashboard. Mounted rather than
      # copied because this Dockerfile's build context is ./backend and cannot
      # reach ../docs - and because a mount means `git pull` updates the notes
      # without rebuilding an image.
      #
      # Read-only, and tiny: the Drive warning at the top of this file is about
      # bind-mounting the whole repo for writes, not about one text file the VM
      # serves from its own clone.
      - ./docs:/app/docs:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # The console itself: builds the SPA and serves it, proxying /api to `api`.
  web:
    build: ./frontend
    ports:
      # Host loopback only - the VM's own nginx terminates TLS and proxies to
      # this, exactly as PPA does. Nothing here is exposed to the internet
      # directly.
      #
      # The port is overridable because this VM runs more than one of these
      # stacks and they cannot share a host port. wholesale-order-entry, which
      # this compose file was modelled on, already holds 8083 there - set
      # YMAL_WEB_PORT in .env to move this one. Remember to point the VM's
      # nginx at whatever you choose.
      - "127.0.0.1:${YMAL_WEB_PORT:-8083}:80"
    # Deliberately no depends_on: api. A dependency on a profiled service
    # implicitly enables that profile, which would drag in an api that cannot
    # start yet. nginx resolves the upstream lazily (see nginx.conf), so the
    # console loads and reports "not connected" instead of failing to boot.
    restart: unless-stopped

volumes:
  pgdata:
  ymal_data:
